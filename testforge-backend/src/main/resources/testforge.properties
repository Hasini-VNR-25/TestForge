# ==============================================================================
# TestForge AI - Application Configuration Properties
# ==============================================================================

# Default test generation parameters
testforge.defaults.test-count=5
testforge.defaults.categories=NORMAL,BOUNDARY,EDGE,INVALID_INPUT,EXCEPTION

# AI Model settings
testforge.gemini.model=gemini-3.5-flash-lite
testforge.gemini.timeout-seconds=30
testforge.gemini.temperature=0.2
gemini.api.key=${GEMINI_API_KEY}

# Persistence & Storage paths
testforge.storage.export-path=./exports
testforge.storage.backup-dir=./backups

# Quality threshold limits
testforge.quality.min-acceptable-score=75
